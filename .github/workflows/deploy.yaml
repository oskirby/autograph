name: Deploy
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9a-z]+.[0-9a-z]+'

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  dockerhub:
    name: Dockerhub
    runs-on: ubuntu-22.04
    environment: dockerhub
    needs:
      - build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autograph-images-${{ github.sha }}
          run-id: ${{ github.event.workflow_run.id }}
          path: docker-cache/

      - name: Load images
        shell: bash
        run: docker load -i docker-cache/autograph-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Dockerhub
        shell: bash
        env:
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag autograph-app "${DOCKERHUB_REPO}:${{github.ref_name}}"
            docker push "${DOCKERHUB_REPO}:${{github.ref_name}}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag autograph-app ${DOCKERHUB_REPO}:latest
            docker push ${DOCKERHUB_REPO}:latest
          fi
