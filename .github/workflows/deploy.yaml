name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  dockerhub:
    name: Dockerhub
    runs-on: ubuntu-22.04
    needs:
      - build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autograph-images-${{ github.sha }}
          run-id: ${{ github.event.workflow_run.id }}
          path: docker-cache/
